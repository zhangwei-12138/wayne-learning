<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>个人名片</title>
  <style>
    body {
      background: #f5f6fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.11);
      padding: 40px 32px 32px 32px;
      max-width: 330px;
      width: 100%;
      text-align: center;
      transition: box-shadow 0.2s;
    }
    .avatar {
      width: 84px;
      height: 84px;
      background: #836ef6;
      border-radius: 15px;
      margin: 0 auto 22px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #fff;
      font-weight: bold;
      user-select: none;
    }
    .name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #2d3047;
    }
    .job {
      font-size: 15px;
      color: #6c6f7b;
      margin-bottom: 18px;
      font-weight: 500;
    }
    .motto {
      font-size: 14px;
      font-style: italic;
      color: #888da9;
      margin-bottom: 26px;
      line-height: 1.6;
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 6px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      background: #ececff;
      color: #585bea;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.17s, color 0.17s;
      text-decoration: none;
    }
    .btn.github:hover {
      background: #171515;
      color: #fff;
    }
    .btn.email:hover {
      background: #ef4444;
      color: #fff;
    }
    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      BZ
    </div>
    <div class="name">张博</div>
    <div class="job">前端工程师</div>
    <div class="motto">"保持好奇，持续学习。"</div>
    <div class="socials">
      <a class="btn github" href="https://github.com/" target="_blank">
        <svg viewBox="0 0 24 24">
          <path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.4-4-1.4-.5-1.1-1.2-1.4-1.2-1.4-1-.7 0-.7 0-.7 1.1.1 1.7 1.2 1.7 1.2 1 .1 1.7-.6 2-1 .1-.7.4-1 .7-1.2-2.6-.3-5.3-1.3-5.3-5.6 0-1.2.4-2.1 1.1-2.9-.1-.3-.5-1.4.1-2.9 0 0 .8-.3 2.6 1.1a8.87 8.87 0 0 1 4.7 0c1.8-1.4 2.6-1.1 2.6-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 2.9 0 4.3-2.7 5.4-5.3 5.6.4.3.8 1 .8 2v3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"></path>
        </svg>
        GitHub
      </a>
      <a class="btn email" href="mailto:zhangbo@example.com">
        <svg viewBox="0 0 24 24">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 2v.01L12 13 4 6.01V6h16zm-16 2.47l7.23 6.11c.37.32.92.32 1.29 0L20 8.47V18H4V8.47z"></path>
        </svg>
        邮箱
      </a>
    </div>
  </div>
</body>
</html>
